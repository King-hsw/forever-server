name: Build and Push Docker Image

# push main/release 分支、打 v* 标签，或手动触发
on:
  push:
    branches: [main, release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # 每个平台一个 job 并行构建；单平台镜像先按「摘要」推送，
    # 不打 tag，避免与另一个 job 互相覆盖
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 校验 Docker Hub 镜像名变量
        run: test -n "${{ vars.DOCKERHUB_IMAGE }}" || { echo "请先在仓库 Settings → Variables 配置 DOCKERHUB_IMAGE（全小写，如 xxx/forever-server）"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ vars.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.short }}
          cache-to: type=gha,scope=build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          TAGS="-t $IMAGE:latest"
          # tag 触发时（refs/tags/v*）额外打版本号 tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          docker buildx imagetools create $TAGS \
            $(printf "$IMAGE@sha256:%s " *)

      - name: 创建 Docker Hub 多架构清单并推送
        working-directory: /tmp/digests
        run: |
          DH_IMAGE="${{ vars.DOCKERHUB_IMAGE }}"
          TAGS="-t $DH_IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $DH_IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          docker buildx imagetools create $TAGS \
            $(printf "$DH_IMAGE@sha256:%s " *)

      - name: 检查清单
        run: |
          docker buildx imagetools inspect $IMAGE:latest
          docker buildx imagetools inspect "${{ vars.DOCKERHUB_IMAGE }}:latest"
