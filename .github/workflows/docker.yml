name: Build and Push Docker Image

# push main/release 分支、打 v* 标签，或手动触发
on:
  push:
    branches: [main, release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # 每个平台一个 job 并行构建；单平台镜像先按「摘要」推送，
    # 不打 tag，避免与另一个 job 互相覆盖
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.short }}
          cache-to: type=gha,scope=build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          TAGS="-t $IMAGE:latest"
          # tag 触发时（refs/tags/v*）额外打版本号 tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          # 刚按摘要推送的清单要一会儿才能按摘要读到（GHCR 最终一致性延迟），带重试
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *); then ok=1; break; fi
            echo "::warning::摘要暂不可读（GHCR 一致性延迟），15s 后重试（$i/6）"
            sleep 15
          done
          [[ $ok == 1 ]] || exit 1

      - name: 检查清单
        run: docker buildx imagetools inspect $IMAGE:latest

  dockerhub:
    # GHCR 发布完成后，把现成的多架构镜像整体复制到 Docker Hub（不重建）。
    # 独立 job：失败不影响 GHCR，可单独重跑；以后加 registry 照此再加 job
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 安装 skopeo
        run: sudo apt-get update -y && sudo apt-get install -y skopeo

      - name: 复制镜像到 Docker Hub
        env:
          DH_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          test -n "$DH_IMAGE" || { echo "请先在仓库 Settings → Variables 配置 DOCKERHUB_IMAGE（全小写，如 xxx/forever-server）"; exit 1; }
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$DH_TOKEN" | skopeo login docker.io -u "$DH_USER" --password-stdin
          TAGS=(latest)
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAGS+=("${GITHUB_REF#refs/tags/}")
          for TAG in "${TAGS[@]}"; do
            ok=0
            for i in 1 2 3; do
              # 跨 runner 刚打的 tag 也可能有短暂一致性延迟
              if skopeo copy --all "docker://$IMAGE:$TAG" "docker://$DH_IMAGE:$TAG"; then ok=1; break; fi
              sleep 10
            done
            [[ $ok == 1 ]] || { echo "skopeo copy $IMAGE:$TAG → $DH_IMAGE:$TAG 重试 3 次仍失败" >&2; exit 1; }
          done
