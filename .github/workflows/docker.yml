name: Build and Push Docker Image

# push main/release 分支、打 v* 标签，或手动触发
on:
  push:
    branches: [main, release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # 每个平台一个 job 并行构建；单平台镜像先按「摘要」推送，
    # 不打 tag，避免与另一个 job 互相覆盖
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Dockerfile 只拷分层产物（构建阶段已移出镜像）：每个平台 job 先 mvn 打包
      # + 分层展开，产物落在工作区即进入 buildx 构建上下文
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          maven-version: '3.9'
          cache: maven

      - name: mvn package
        run: mvn -B package -DskipTests

      # 与 .cnb.yml 同款：Dockerfile 按层 COPY extracted/（见其中注释）
      - name: extract layers
        run: java -Djarmode=tools -jar target/forever-server-*.jar extract --layers --launcher --destination extracted

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.short }}
          cache-to: type=gha,scope=build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # ghcr 要求镜像名全小写（owner King-hsw 含大写），统一转换后再用
      - name: 镜像名转小写
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          TAGS="-t $IMAGE:latest"
          # tag 触发时（refs/tags/v*）额外打版本号 tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          # 刚按摘要推送的清单要一会儿才能按摘要读到（GHCR 最终一致性延迟），带重试
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *); then ok=1; break; fi
            echo "::warning::摘要暂不可读（GHCR 一致性延迟），15s 后重试（$i/6）"
            sleep 15
          done
          [[ $ok == 1 ]] || exit 1

      - name: 检查清单
        run: docker buildx imagetools inspect $IMAGE:latest

  dockerhub:
    # GHCR 发布完成后，把现成的多架构镜像整体复制到 Docker Hub（不重建）。
    # 独立 job：失败不影响 GHCR，可单独重跑；以后加 registry 照此再加 job
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 安装 skopeo
        run: sudo apt-get update -y && sudo apt-get install -y skopeo

      - name: 复制镜像到 Docker Hub
        env:
          DH_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # GITHUB_TOKEN 不是默认环境变量（默认只有 GITHUB_ACTOR/GITHUB_REF 等），
          # 必须显式从 secrets 注入；且不能用 GITHUB_ 前缀命名，故取名 GH_TOKEN
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # 凭据为空时 skopeo 不报错，而是回退成交互式输入（CI 无 tty，最终报
          # "inappropriate ioctl for device"），所以先体检：只报「有没有值」，不打印值
          missing=0
          for v in DH_IMAGE DH_USER DH_TOKEN GH_TOKEN; do
            if [[ -n "${!v}" ]]; then
              echo "✓ $v 已注入"
            else
              echo "::error::$v 为空（未配置，或没写进本 step 的 env:）"
              missing=1
            fi
          done
          [[ $missing == 0 ]] || { echo "缺 DH_IMAGE/DH_USER/DH_TOKEN 见仓库 Settings 的 Variables/Secrets；GH_TOKEN 为空说明 secrets.GITHUB_TOKEN 未注入本 step"; exit 1; }

          TAGS=(latest)
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAGS+=("${GITHUB_REF#refs/tags/}")
          for TAG in "${TAGS[@]}"; do
            ok=0
            for i in 1 2 3 4 5; do
              # 跨 runner 刚打的 tag 也可能有短暂一致性延迟
              # 直接传 --src-creds/--dest-creds：不走 skopeo login，
              # 也就不会有 authfile 缺失导致回退交互式输入的问题
              if skopeo copy --all \
                   --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                   --dest-creds "$DH_USER:$DH_TOKEN" \
                   "docker://$IMAGE:$TAG" "docker://$DH_IMAGE:$TAG"; then ok=1; break; fi
              echo "::warning::$TAG 复制失败，15s 后重试（$i/5）"
              sleep 15
            done
            [[ $ok == 1 ]] || { echo "::error::skopeo copy $IMAGE:$TAG → $DH_IMAGE:$TAG 重试 5 次仍失败"; exit 1; }
          done

  tencent:
    # 把现成的多架构镜像整体复制到腾讯云 CCR（与 dockerhub job 同款，不重建）
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 安装 skopeo
        run: sudo apt-get update -y && sudo apt-get install -y skopeo

      - name: 复制镜像到腾讯云 CCR
        env:
          CCR_IMAGE: ccr.ccs.tencentyun.com/king-hsw/forever-server
          CCR_USER: ${{ secrets.TENCENT_CCR_USERNAME }}
          CCR_PASS: ${{ secrets.TENCENT_CCR_PASSWORD }}
          # GITHUB_TOKEN 必须显式从 secrets 注入，且不能用 GITHUB_ 前缀命名
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 凭据为空时 skopeo 不报错而是回退交互式输入，先体检：只报「有没有值」
          missing=0
          for v in CCR_IMAGE CCR_USER CCR_PASS GH_TOKEN; do
            if [[ -n "${!v}" ]]; then
              echo "✓ $v 已注入"
            else
              echo "::error::$v 为空（未配置，或没写进本 step 的 env:）"
              missing=1
            fi
          done
          [[ $missing == 0 ]] || exit 1

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=(latest)
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAGS+=("${GITHUB_REF#refs/tags/}")
          for TAG in "${TAGS[@]}"; do
            ok=0
            for i in 1 2 3 4 5; do
              # 直接传 --src-creds/--dest-creds：不走 skopeo login，
              # 也就不会有 authfile 缺失导致回退交互式输入的问题
              if skopeo copy --all \
                   --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                   --dest-creds "$CCR_USER:$CCR_PASS" \
                   "docker://$IMAGE:$TAG" "docker://$CCR_IMAGE:$TAG"; then ok=1; break; fi
              echo "::warning::$TAG 复制失败，15s 后重试（$i/5）"
              sleep 15
            done
            [[ $ok == 1 ]] || { echo "::error::skopeo copy $IMAGE:$TAG → $CCR_IMAGE:$TAG 重试 5 次仍失败"; exit 1; }
          done
