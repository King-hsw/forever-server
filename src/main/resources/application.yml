spring:
  application:
    name: forever-server
  # 本地开发私密配置（不入 git）：数据库账密、blog.* 全部在 ./local/application-local.yml
  # 首次克隆仓库后需手动创建该文件才能启动，模板见 README 或向仓库维护者索取
  config:
    import:
      - optional:file:./local/application-local.yml
  # 动态媒体上传：单文件 120MB（视频 100MB 上限留余量）/ 单请求 130MB
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 130MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Web Push VAPID 密钥（私密，不入 git）：实际值放 local/application-local.yml 或环境变量；
# 三项任一缺失即推送功能关闭（/api/v1/push/vapid 与发送报 503）。生成：npx web-push generate-vapid-keys
blog:
  push:
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:}

# 日志级别与输出在 logback-spring.xml 中统一维护

# 说明：blog.* 为启动期配置（admin 见 local/application-local.yml，storage 见 application-prod.yml）；
# 评论策略、站点地址等运行参数由后台「站点设置」管理：GET/PUT /api/admin/settings，
# 修改即时生效、重启不丢
